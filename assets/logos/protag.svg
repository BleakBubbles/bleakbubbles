<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
<title>Protag</title>
<!-- Protag brand mark (assets/brand/logo.svg) on the app icon's cream background.
     The stem runs off the bottom edge; the viewBox crops it, as in the store icon.
     The ring is one even-odd path (outer ellipse minus inner), not a <mask>:
     Firefox/Zen sometimes fail to draw masked SVG images onto a canvas, which
     broke the page freeze's snapshot of the whole Protag card. The inner
     centre is shifted into the outer ellipse's rotated frame. -->
<rect width="560" height="560" fill="#f5e7ca"/>
<g fill="#446170">
  <rect x="144.73" y="279.964" width="56" height="840"/>
  <path fill-rule="evenodd" transform="rotate(-22.5 279.611 254.964)"
        d="M139.611 254.964a140 100 0 1 0 280 0a140 100 0 1 0 -280 0Z
           M195.718 254.591a84 60 0 1 0 168 0a84 60 0 1 0 -168 0Z"/>
</g>
</svg>
